<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="AppDirect">
  <!--
    AppDirect brand mark. AppDirect's identity uses a triangular logo that
    "highlights where interests overlap" — a three-sided marketplace mark.
    This mark renders three overlapping triangles in the AppDirect brand
    teal (#006080) with transparency to expose the convergence points,
    followed by an "AppDirect" wordmark.
  -->
  <defs>
    <linearGradient id="ad-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0080a6" />
      <stop offset="1" stop-color="#006080" />
    </linearGradient>
  </defs>
  <!-- Triangle mark: three overlapping triangles forming a convergence -->
  <g transform="translate(8 14)" fill="url(#ad-grad)">
    <polygon points="26,0 52,45 0,45" opacity="0.85" />
    <polygon points="0,8 52,8 26,53" opacity="0.55" />
    <polygon points="13,0 39,0 26,22" opacity="0.95" />
  </g>
  <!-- Wordmark -->
  <text x="78" y="52"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="32" font-weight="700" fill="#006080" letter-spacing="-0.5">AppDirect</text>
</svg>
