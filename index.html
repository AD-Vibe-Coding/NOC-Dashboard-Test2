<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vcom-logo.png" />
    <link rel="apple-touch-icon" href="/vcom-logo.png" />
    <meta name="theme-color" content="#a4c8db" />
    <title>vCom NOC Operations Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const resetKey = "__preview_app_reset_v1";
        try {
          if (!sessionStorage.getItem(resetKey)) {
            localStorage.clear();
            sessionStorage.clear();
            sessionStorage.setItem(resetKey, "done");
            if ("caches" in window) {
              caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {});
            }
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations().then((regs) => Promise.all(regs.map((reg) => reg.unregister()))).catch(() => {});
            }
          }
        } catch {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/devs-inspect.js"></script>
  </body>
</html>
