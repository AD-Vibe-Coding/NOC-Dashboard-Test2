<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AppDirect">
  <!-- Square favicon-sized AppDirect mark: three overlapping triangles. -->
  <defs>
    <linearGradient id="m-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0080a6" />
      <stop offset="1" stop-color="#006080" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#e6f3f7" />
  <g transform="translate(8 10) scale(0.95)" fill="url(#m-grad)">
    <polygon points="24,0 48,42 0,42" opacity="0.85" />
    <polygon points="0,6 48,6 24,48" opacity="0.55" />
    <polygon points="12,0 36,0 24,20" opacity="0.95" />
  </g>
</svg>
