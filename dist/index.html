<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vcom-logo.png" />
    <link rel="apple-touch-icon" href="/vcom-logo.png" />
    <meta name="theme-color" content="#a4c8db" />
    <title>vCom NOC Operations Dashboard</title>
    <script type="module" crossorigin src="/assets/index-C0nlJvTX.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B8NFhecJ.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-error" style="display:none;font-family:ui-sans-serif,system-ui,sans-serif;padding:24px;max-width:900px;margin:40px auto;border:1px solid #fecaca;background:#fef2f2;color:#7f1d1d;border-radius:12px;white-space:pre-wrap"></div>
    <script>
      (() => {
        const show = (label, err) => {
          try {
            const el = document.getElementById("boot-error");
            if (!el) return;
            const detail =
              (err && (err.stack || err.message || String(err))) || String(err);
            el.style.display = "block";
            el.textContent =
              (el.textContent ? el.textContent + "\n\n" : "") +
              label +
              "\n" +
              detail;
          } catch {}
        };
        window.addEventListener("error", (e) => {
          show("Runtime error", e.error || e.message);
        });
        window.addEventListener("unhandledrejection", (e) => {
          show("Unhandled promise rejection", e.reason);
        });

        // One-shot client cache reset (safe for the sandboxed preview iframe).
        //
        // Re-enabled after the "Bundled · 51 issues" sticky-cache bug, but
        // WITHOUT location.replace / location.reload. A reload-based wipe can
        // loop forever here because sessionStorage is unreliable in the iframe.
        // localStorage flag is durable and does not require a hard navigation.
        const resetKey = "__preview_app_reset_v8_soft_identity";
        try {
          if (localStorage.getItem(resetKey) === "done") return;

          // Drop any cached Mobility / OPUS / Confluence payloads that can pin
          // the UI on "Bundled · 51 issues" even when the API is live.
          const keysToDrop = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (
              k &&
              /mobility|confluence|opus|ota|buyers.?club|troubleshoot/i.test(k)
            ) {
              keysToDrop.push(k);
            }
          }
          keysToDrop.forEach((k) => localStorage.removeItem(k));

          // Also clear sessionStorage once (best-effort; may be partitioned).
          try {
            sessionStorage.clear();
          } catch {}

          localStorage.setItem(resetKey, "done");

          if ("caches" in window) {
            caches
              .keys()
              .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
              .catch(() => {});
          }
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then((regs) => Promise.all(regs.map((reg) => reg.unregister())))
              .catch(() => {});
          }
        } catch {}
      })();
    </script>
    <script src="/devs-inspect.js"></script>
  </body>
</html>
